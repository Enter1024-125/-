<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語エンドレスタイピングテスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Excelファイルを読み込むためのライブラリ（SheetJS） -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6 space-y-6">
        <h1 class="text-2xl font-bold text-center text-blue-600">単語タイピングテスト</h1>

        <!-- 1. ファイルアップロード画面 -->
        <div id="upload-screen" class="space-y-4">
            <p class="text-sm text-gray-600 text-center">
                英単語のExcel形式のファイルを選択してスタートしてください。<br>
                <span class="text-xs">※A列・B列のどちらかが日本語/英語であれば自動判別します。</span>
            </p>
            <input type="file" id="file-input" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500
                file:mr-4 file:py-2 file:px-4
                file:rounded-full file:border-0
                file:text-sm file:font-semibold
                file:bg-blue-50 file:text-blue-700
                hover:file:bg-blue-100
            "/>
            <button id="start-btn" class="w-full py-2 bg-blue-500 text-white rounded-lg font-bold hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed transition" disabled>
                テストを開始する
            </button>
            <p id="upload-error" class="text-red-500 text-sm text-center hidden"></p>
        </div>

        <!-- 2. クイズ画面 -->
        <div id="quiz-screen" class="space-y-6 hidden">
            <div class="flex justify-between items-center text-sm font-semibold text-gray-500">
                <span>残り単語数: <span id="queue-count" class="text-blue-600 text-lg">0</span></span>
            </div>

            <div class="text-center space-y-2">
                <p class="text-gray-500 text-sm">以下の日本語を英語にしてください</p>
                <h2 id="question-text" class="text-3xl font-bold text-gray-800 break-words">日本語</h2>
            </div>

            <div class="space-y-4">
                <input type="text" id="answer-input" autocomplete="off" placeholder="英語を入力..." class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 text-lg text-center" />
                <button id="submit-btn" class="w-full py-3 bg-blue-500 text-white rounded-lg font-bold hover:bg-blue-600 transition">
                    回答する (Enter)
                </button>
            </div>

            <div id="feedback-area" class="text-center p-3 rounded-lg hidden">
                <!-- 正解・不正解のフィードバックがここに入ります -->
            </div>
            
            <button id="next-btn" class="w-full py-3 bg-green-500 text-white rounded-lg font-bold hover:bg-green-600 transition hidden">
                次の問題へ (Enter)
            </button>
        </div>

        <!-- 3. 結果画面 -->
        <div id="result-screen" class="space-y-6 text-center hidden">
            <h2 class="text-3xl font-bold text-green-500">🎉 全問クリア！</h2>
            <p class="text-gray-600">お疲れ様でした。すべての単語をマスターしました！</p>
            <button onclick="location.reload()" class="w-full py-2 bg-blue-500 text-white rounded-lg font-bold hover:bg-blue-600 transition">
                最初からやり直す
            </button>
        </div>

    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const startBtn = document.getElementById('start-btn');
        const uploadError = document.getElementById('upload-error');
        
        const uploadScreen = document.getElementById('upload-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');

        const queueCountEl = document.getElementById('queue-count');
        const questionText = document.getElementById('question-text');
        const answerInput = document.getElementById('answer-input');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedbackArea = document.getElementById('feedback-area');

        let vocabQueue = [];
        let currentWord = null;
        let isWaitingForNext = false;

        // 日本語が含まれているか判定するヘルパー関数
        function hasJapanese(str) {
            return /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/.test(str);
        }

        // 配列をシャッフルする関数（フィッシャー–イェーツのシャッフル）
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ファイルが選択されたらスタートボタンを有効化
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                startBtn.disabled = false;
            } else {
                startBtn.disabled = true;
            }
        });

        // スタートボタン押下時の処理
        startBtn.addEventListener('click', () => {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                    let vocabList = [];

                    // データを解析
                    for (let row of rows) {
                        if (row.length >= 2 && row[0] != null && row[1] != null) {
                            let val1 = String(row[0]).trim();
                            let val2 = String(row[1]).trim();
                            if (val1 === "" || val2 === "") continue;

                            let ja, en;
                            // どちらが日本語かを判定
                            if (hasJapanese(val1)) {
                                ja = val1;
                                en = val2;
                            } else {
                                ja = val2;
                                en = val1;
                            }
                            vocabList.push({ ja, en });
                        }
                    }

                    if (vocabList.length === 0) {
                        throw new Error("単語データが見つかりませんでした。A列とB列にデータがあるか確認してください。");
                    }

                    // ゲームの初期化
                    vocabQueue = shuffleArray([...vocabList]);
                    startGame();

                } catch (error) {
                    uploadError.textContent = "エラー: " + error.message;
                    uploadError.classList.remove('hidden');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function startGame() {
            uploadScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            showNextWord();
        }

        function showNextWord() {
            if (vocabQueue.length === 0) {
                // 全問正解でクリア
                quizScreen.classList.add('hidden');
                resultScreen.classList.remove('hidden');
                return;
            }

            isWaitingForNext = false;
            currentWord = vocabQueue[0]; // キューの先頭を取得（まだ削除しない）
            
            queueCountEl.textContent = vocabQueue.length;
            questionText.textContent = currentWord.ja;
            
            answerInput.value = '';
            answerInput.disabled = false;
            answerInput.focus();
            
            submitBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            feedbackArea.classList.add('hidden');
            feedbackArea.innerHTML = '';
        }

        function checkAnswer() {
            if (isWaitingForNext) {
                showNextWord();
                return;
            }

            const userAnswer = answerInput.value.trim().toLowerCase();
            const correctAnswer = currentWord.en.toLowerCase();

            // 空白入力は無視
            if (userAnswer === '') return;

            isWaitingForNext = true;
            answerInput.disabled = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            feedbackArea.classList.remove('hidden');

            if (userAnswer === correctAnswer) {
                // 正解の処理
                feedbackArea.className = 'text-center p-3 rounded-lg bg-green-100 text-green-700 border border-green-300 font-bold';
                feedbackArea.innerHTML = '⭕ 正解！';
                vocabQueue.shift(); // キューから削除
            } else {
                // 不正解の処理
                feedbackArea.className = 'text-center p-3 rounded-lg bg-red-100 text-red-700 border border-red-300';
                feedbackArea.innerHTML = `❌ 不正解...<br><span class="text-sm font-normal">正解は:</span> <strong class="text-lg">${currentWord.en}</strong>`;
                
                // 不正解なのでキューの先頭から取り出し、最後尾に追加してシャッフル
                let wrongWord = vocabQueue.shift();
                vocabQueue.push(wrongWord);
                vocabQueue = shuffleArray(vocabQueue);
            }

            nextBtn.focus();
        }

        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', showNextWord);

        // Enterキーでの操作サポート
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
    </script>
</body>
</html>
